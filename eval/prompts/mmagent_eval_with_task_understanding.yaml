system_prompt: |-
  你的任务是：在数学建模背景下，基于问题背景与问题要求，结合该任务整体的「核心目标与约束标准（Task Understanding）」，评估建模者对整篇建模报告进行建模时的**合理性、严谨性、实用性、科学性以及对整体核心目标的达成度**。

  你必须采用“证据优先、缺失封顶”的统一校准原则：只根据报告中明确出现的内容评分；与题目无关的技术复杂度、术语数量和篇幅不能补偿核心任务或必要输出的缺失。5 分表示最低限度达标，7 分以上必须有清晰且可核查的证据，9–10 分仅用于没有重大缺失且完成度接近全面的报告。

problem_analysis_prompt: |-
  你的任务是：在数学建模背景下，基于问题背景与问题要求，评估建模者在整篇报告中对问题进行拆解与分析时的**合理性、整体一致性及对总体任务目标的准确把握**。

  **问题背景**：
  {{background}}

  **问题要求**：
  {{requirements}}

  **整体任务的核心要求与约束（Task Understanding）**：
  {{task_understanding_all}}

  **统一评分校准规则**：
  - 只采信报告中明确出现的定义、约束、方法与输出，不自行补全作者未写出的内容。
  - 若完整缺失一个核心子任务，`scope_and_coverage` 最高 4 分；若仅罗列通用方法但未映射到本题，相关维度最高 5 分。
  - 技术术语丰富、方法前沿或篇幅很长，不得抵消任务错位、关键约束遗漏或输出缺失。
  - 5 分表示最低限度达标；7–8 分要求大部分约束均有明确证据；9–10 分要求几乎无重大缺失。
  - 评价理由必须同时指出至少一项满足点和一项缺失点；如确无缺失，应明确说明核查依据。

  以下是建模者给出的任务分析：
  **任务分析**：
  {{task_analysis}}

  **评估维度**：
  ### 1. 问题分析与理解

  #### 1.1 问题定义与目标达成度
  要求问题定义清晰，必须准确对齐整体的「核心目标」与「建模类型」。
  - 问题的研究范围与总体目标是否清晰界定，且符合核心目标要求？
  - 是否有效识别了问题的关键组成部分及所需的建模类型？
  - 模型试图解决的实际总体目标是否被清楚陈述？

  **评分标准**：
  1 - 2 = 完全不清晰或严重偏离核心目标；
  3 - 4 = 不够清晰，仅触及表面；
  5 - 6 = 基本清晰，大致符合预期；
  7 - 8 = 清晰，很好地对齐了整体任务目标；
  9 - 10 = 非常清晰，深度契合核心目标。

  #### 1.2 相关性与覆盖性
  评估是否紧扣问题核心，完整覆盖了任务约束，并清晰定位了各部分在整体流程中的角色。
  - 各项分析是否直接服务于最终目标，并明确了它们在全流程中的角色？
  - 是否覆盖了所有关键输入与约束条件？
  - 是否存在关键部分缺失或偏离真实目标的情况？

  **评分标准**：
  1 - 2 = 完全偏离目标或遗漏绝大多数约束；
  3 - 4 = 部分偏离，遗漏关键约束；
  5 - 6 = 基本覆盖；
  7 - 8 = 大部分覆盖，流程角色清晰；
  9 - 10 = 完全覆盖，逻辑极其严密。

  **输出格式要求（JSON）**：
  请严格按照以下 JSON 结构输出，不要包含任何额外文本说明，不要使用 Markdown，不要添加注释。

  ```json
  {
    "problem_definition_and_goals": {
      "reason": "对 1.1 问题定义与目标达成度 的评价理由",
      "score": 1-10 的整数
    },
    "scope_and_coverage": {
      "reason": "对 1.2 相关性与覆盖性 的评价理由",
      "score": 1-10 的整数
    }
  }
  ```

modeling_rigor_prompt: |-
  你的任务是：在数学建模背景下，基于问题背景、问题要求以及整体任务约束，评估整篇建模报告在**假设设定与模型构建方面的严谨性与合理性**。

  **问题背景**：
  {{background}}

  **问题要求**：
  {{requirements}}

  **整体任务的核心要求与约束（Task Understanding）**：
  {{task_understanding_all}}

  **统一评分校准规则**：
  - 只采信报告中明确写出的假设、公式、模型结构及其与题目约束的映射，不替作者推断。
  - 未明确给出关键假设时，`assumptions` 最高 4 分；只罗列通用算法而未说明如何解决本题时，`model_rationality` 最高 5 分。
  - 与任务无关的复杂模型、术语堆叠和“可进一步采用某方法”的建议不计为已完成建模。
  - 5 分表示最低限度达标；7–8 分要求关键结构有可核查证据；9–10 分要求逻辑严密且无重大缺失。
  - 评价理由必须同时列出满足证据和扣分依据。

  以下是建模者的建模分析内容：
  **建模分析**：
  {{modeling_analysis}}

  **评估维度**：
  ### 2. 建模的严谨性与合理性

  #### 2.1 假设设定
  模型假设应当清晰明确，构成理论基础，并且不得违背给定的关键约束。
  - 模型假设是否清楚说明？
  - 假设是否与实际问题背景相符，是否妥善处理了各项输入限制与隐含条件？
  - 是否讨论了假设的合理性及其对总体结果的影响？

  **评分标准**：
  1 - 2 = 完全不合理或与核心约束矛盾；
  3 - 4 = 部分合理；
  5 - 6 = 一般；
  7 - 8 = 合理，较好地结合了任务约束；
  9 - 10 = 非常合理，逻辑自洽且严密。

  #### 2.2 结构合理性
  关注模型选择与结构是否科学地反映了实际问题，并能支撑整体预期的输出。
  - 是否选择了合适的建模方法与指标来支撑各项预期输出？
  - 模型结构是否能够真实刻画问题本质，满足整体核心目标？

  **评分标准**：
  1 - 2 = 完全不合理；
  3 - 4 = 部分合理；
  5 - 6 = 一般；
  7 - 8 = 合理；
  9 - 10 = 非常合理。

  **输出格式要求（JSON）**：
  请严格按照以下 JSON 结构输出，不要包含任何额外文本说明，不要使用 Markdown，不要添加注释。

  ```json
  {
    "assumptions": {
      "reason": "对 2.1 假设设定 的评价理由",
      "score": 1-10 的整数
    },
    "model_rationality": {
      "reason": "对 2.2 结构合理性 的评价理由",
      "score": 1-10 的整数
    }
  }
  ```

practicality_scientificity_prompt: |-
  你的任务是：在数学建模背景下，基于问题要求及整体任务约束，评估整篇建模报告的**实用性与科学性**，重点关注整体模型是否具备实际问题求解能力，以及是否能产生符合各项子任务的预期输出形态。

  **问题背景**：
  {{background}}

  **问题要求**：
  {{requirements}}

  **整体任务的核心要求与约束（Task Understanding）**：
  {{task_understanding_all}}

  **统一评分校准规则**：
  - 只采信报告中实际描述或执行的流程，不把计划、建议、未来工作当作已完成工作。
  - 缺少可执行步骤、关键参数或上下游接口时，`practicality` 最高 4 分；只有通用理论、没有本题适配与验证时，`scientificity` 最高 5 分。
  - 技术先进性不能补偿任务错位、不可运行或关键数据未使用。
  - 5 分表示最低限度达标；7–8 分要求流程可复现且证据充分；9–10 分要求完整验证且无重大缺失。
  - 评价理由必须同时列出满足证据和扣分依据。

  以下是建模者的建模过程描述：
  **建模过程**：
  {{modeling_process}}

  **评估维度**：
  ### 3. 实用性与科学性

  #### 3.1 实用性与流程契合度
  - 建模方法是否匹配各类建模类型的特征与需求？
  - 整体模型是否可实际运行，并能顺利完成各模块间（上下游环节）的对接？
  - 是否提供了超越简单拟合的数据洞见，能够支持预期的决策、解释或预测？

  **评分标准**：
  1 - 2 = 完全不具备实用性；
  3 - 4 = 部分实用；
  5 - 6 = 一般；
  7 - 8 = 具备实用性，整体流程连贯；
  9 - 10 = 非常实用，无缝衔接且逻辑自洽。

  #### 3.2 科学性
  - 整体建模是否遵循科学原理并具有理论基础？
  - 模型的求解过程是否能科学、稳定地生成各项预期输出所需的参数或对象？
  - 是否体现对问题本质的深入理解，而非生搬硬套通用方法？

  **评分标准**：
  1 - 2 = 完全不科学；
  3 - 4 = 部分科学；
  5 - 6 = 一般；
  7 - 8 = 科学；
  9 - 10 = 非常科学。

  **输出格式要求（JSON）**：
  请严格按照以下 JSON 结构输出，不要包含任何额外文本说明，不要使用 Markdown，不要添加注释。

  ```json
  {
    "practicality": {
      "reason": "对 3.1 实用性与流程契合度 的评价理由",
      "score": 1-10 的整数
    },
    "scientificity": {
      "reason": "对 3.2 科学性 的评价理由",
      "score": 1-10 的整数
    }
  }
  ```

result_bias_prompt: |-
  你的任务是：评估整篇建模报告中的**结果分析与偏差分析**，重点关注模型输出是否满足了整体任务的预期，结果是否具备可解释性，以及对潜在偏差的识别与修正。

  **问题背景**：
  {{background}}

  **问题要求**：
  {{requirements}}

  **整体任务的核心要求与约束（Task Understanding）**：
  {{task_understanding_all}}

  **统一评分校准规则**：
  - 只采信报告中实际给出的结果、表格、图、数值或可核查结论，不把预期结果和方法描述当作真实结果。
  - 缺失题目要求的核心数值/表格/图时，`result_analysis` 最高 3 分；没有任何定量不确定性分析时，`bias_analysis` 最高 6 分。
  - 与题目无关的实验或泛化讨论不能补偿核心输出缺失。
  - 5 分表示最低限度达标；7–8 分要求主要输出齐全且分析充分；9–10 分要求结果完整、验证严密、偏差诊断闭环。
  - 评价理由必须同时列出满足证据和扣分依据。

  以下是建模者的结果与分析内容：
  **建模报告**：
  {{modeling_report}}

  **评估维度**：
  ### 4. 结果分析与偏差分析

  #### 4.1 结果达成度与分析
  - 模型输出结果是否清晰，且**严格满足了整体预期输出的要求**？
  - 是否对模型推理过程进行了充分解释，且论证了总体核心目标的达成？
  - 结果是否具有可解释性，并明确总结了整体模型的优势与不足？

  **评分标准**：
  1 - 2 = 结果缺失或完全不符合预期输出；
  3 - 4 = 部分符合，但解释不清晰；
  5 - 6 = 一般，基本产出结果；
  7 - 8 = 清晰，较好地达成了预期输出；
  9 - 10 = 非常清晰，完美实现预期输出并进行了深度剖析。

  #### 4.2 偏差与不确定性分析
  - 是否识别并分析了潜在偏差（例如数据偏差、模型结构偏差）？
  - 是否按照各项任务要求（如有）进行了不确定度评估或后验区间分析？
  - 是否采取了合理的偏差修正措施或模型诊断？

  **评分标准**：
  1 - 2 = 完全忽略偏差与不确定性；
  3 - 4 = 部分考虑；
  5 - 6 = 一般；
  7 - 8 = 考虑并修正，有一定的不确定度分析；
  9 - 10 = 非常全面，偏差控制与诊断报告极佳。

  **输出格式要求（JSON）**：
  请严格按照以下 JSON 结构输出，不要包含任何额外文本说明，不要使用 Markdown，不要添加注释。

  ```json
  {
    "result_analysis": {
      "reason": "对 4.1 结果达成度与分析 的评价理由",
      "score": 1-10 的整数
    },
    "bias_analysis": {
      "reason": "对 4.2 偏差与不确定性分析 的评价理由",
      "score": 1-10 的整数
    }
  }
  ```
